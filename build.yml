name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip game
        run: |
          unzip -q -o "$(ls *.zip | head -n 1)" -d src
          echo "PROJ=$(dirname "$(find src -name settings.gradle | head -n 1)")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          cd "$PROJ"
          # version with real rewarded video ads; if that fails, build the offline version
          gradle assembleAdmobDebug --no-daemon || gradle assembleOfflineDebug --no-daemon
          cp "$(find app/build/outputs/apk -name '*.apk' | head -n 1)" "$GITHUB_WORKSPACE/SlingSmash.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SlingSmash-APK
          path: SlingSmash.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Sling Smash (build ${{ github.run_number }})
          files: SlingSmash.apk
